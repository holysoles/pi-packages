name: Gateway helper npm staged publish

on:
  push:
    tags:
      - "gatewayhelper-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install pinned npm CLI
        run: npm install --global npm@11.15.0
      - run: npm test
        working-directory: gatewayhelper
      - name: Verify tag matches package version
        working-directory: gatewayhelper
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const expectedTag = `gatewayhelper-v${pkg.version}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            console.error("Tag does not match package version");
            process.exit(1);
          }
          NODE
      - run: npm stage publish
        working-directory: gatewayhelper
